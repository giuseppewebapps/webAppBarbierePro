<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiornamento di Sistema</title>
    <style>
        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background-color: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .icon { font-size: 48px; margin-bottom: 24px; animation: pulse 2s infinite; }
        h1 { font-size: 28px; font-weight: 800; margin: 0 0 16px; letter-spacing: -0.5px; }
        p { font-size: 16px; color: #a1a1aa; max-w-md; line-height: 1.6; margin: 0; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="icon">💈</div>
    <h1>Stiamo aggiornando il sistema</h1>
    <p>Stiamo installando una nuova versione della piattaforma per offrirti un'esperienza di prenotazione ancora più veloce e sicura. Torneremo online tra pochissimo.</p>
</body>
</html>
